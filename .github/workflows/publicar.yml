name: Retratar y publicar

# Genera el video del render 3D con kicad-visor, las capturas y la BOM con
# kicad-retrata (y hace commit de lo que cambie), y después construye docs/
# con Jekyll y lo despliega en GitHub Pages, todo en la misma corrida.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Genera el video del render 3D de la placa girando con kicad-visor
  # (https://github.com/piruetasxyz/kicad-visor) y hace commit si cambia.
  # La placa es la del "proyecto" de kicad-retrata.yml, así que al cambiar de
  # revisión ahí también cambia el video. Solo se renderiza cuando cambian la
  # placa o los ajustes de abajo: la huella de ambos queda guardada junto al
  # video, en docs/videos/chufe-placa-3d-giro.huella.
  girar:
    if: github.repository == 'piruetasxyz/chufe'
    runs-on: ubuntu-latest
    # La primera vez renderiza por varias decenas de minutos.
    timeout-minutes: 120
    # Usar la misma versión mayor de KiCad con la que se guardó la placa.
    container:
      image: kicad/kicad:10.0-full
      options: --user root
    env:
      VIDEO: docs/videos/chufe-placa-3d-giro.mp4
      HUELLA: docs/videos/chufe-placa-3d-giro.huella
      EJE: z
      TAMANO: 1080x1080
      FONDO: "#ffffff"
      SEGUNDOS: "6"
    steps:
      # git tiene que estar instalado antes de clonar, para que checkout
      # deje un repositorio donde se pueda hacer commit.
      - name: Instalar kicad-visor
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg librsvg2-bin python3-venv git xvfb xauth fontconfig
          python3 -m venv /opt/kicad-visor
          /opt/kicad-visor/bin/pip install git+https://github.com/piruetasxyz/kicad-visor@v0.0.3

      - name: Clonar repositorio
        uses: actions/checkout@v7

      - name: Revisar si hay que renderizar
        id: revisar
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PROYECTO=$(sed -n 's/^ *proyecto: *//p' kicad-retrata.yml | head -n 1)
          PLACA="$PROYECTO.kicad_pcb"
          if [ ! -f "$PLACA" ]; then
            echo "::error::No existe la placa $PLACA (leída de kicad-retrata.yml)."
            exit 1
          fi
          HUELLA_NUEVA=$( { sha256sum "$PLACA"; echo "$EJE $TAMANO $FONDO $SEGUNDOS kicad-visor@v0.0.3"; } | sha256sum | cut -d ' ' -f 1)
          echo "placa=$PLACA" >> "$GITHUB_OUTPUT"
          echo "huella=$HUELLA_NUEVA" >> "$GITHUB_OUTPUT"
          if [ -f "$VIDEO" ] && [ -f "$HUELLA" ] && [ "$(cat "$HUELLA")" = "$HUELLA_NUEVA" ]; then
            echo "El video ya corresponde a $PLACA, no se renderiza."
            echo "renderizar=false" >> "$GITHUB_OUTPUT"
          else
            echo "Hay que renderizar $PLACA."
            echo "renderizar=true" >> "$GITHUB_OUTPUT"
          fi

      # Talagante aparece en el serigrafiado, así que el render 3D también la
      # necesita. Se instala en el sistema del contenedor, fuera del
      # repositorio.
      - name: Instalar fuentes privadas
        if: steps.revisar.outputs.renderizar == 'true'
        env:
          FUENTE_TALAGANTE: ${{ secrets.FUENTE_TALAGANTE }}
        run: |
          set -eu
          if [ -z "$FUENTE_TALAGANTE" ]; then
            echo "::error::Falta el secreto FUENTE_TALAGANTE."
            exit 1
          fi
          mkdir -p /usr/local/share/fonts/piruetas
          printf '%s' "$FUENTE_TALAGANTE" | base64 --decode > /usr/local/share/fonts/piruetas/Talagante.otf
          fc-cache -f

      - name: Recuperar cuadros renderizados
        if: steps.revisar.outputs.renderizar == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/kicad-visor
          key: kicad-visor-${{ steps.revisar.outputs.huella }}
          restore-keys: kicad-visor-

      # Una pantalla invisible, por si el render 3D de kicad-cli necesita una.
      - name: Renderizar video
        if: steps.revisar.outputs.renderizar == 'true'
        env:
          PLACA: ${{ steps.revisar.outputs.placa }}
          HUELLA_NUEVA: ${{ steps.revisar.outputs.huella }}
        run: |
          set -eu
          mkdir -p "$(dirname "$VIDEO")"
          xvfb-run -a /opt/kicad-visor/bin/kicad-visor turntable "$PLACA" \
            -o "$VIDEO" --axis "$EJE" --size "$TAMANO" \
            --background "$FONDO" --seconds "$SEGUNDOS"
          printf '%s\n' "$HUELLA_NUEVA" > "$HUELLA"

      - name: Commit y push
        if: steps.revisar.outputs.renderizar == 'true'
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$VIDEO" "$HUELLA"
          if git diff --cached --quiet; then
            echo "El video no cambió."
            exit 0
          fi
          git commit --quiet --message "Actualizar video del render 3D de la placa [skip ci]"
          git push

  construir:
    needs: girar
    if: github.repository == 'piruetasxyz/chufe'
    runs-on: ubuntu-latest
    steps:
      # Se clona la punta de la rama, no el commit que disparó la corrida,
      # para incluir el video que girar pudo haber agregado; si no, el push
      # de kicad-retrata sería rechazado.
      - name: Clonar repositorio
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      # Talagante no puede quedar pública en el repositorio: se guarda en
      # base64 en el secreto FUENTE_TALAGANTE y se escribe fuera del
      # repositorio, para que no termine en el commit de kicad-retrata.
      - name: Instalar fuentes privadas
        env:
          FUENTE_TALAGANTE: ${{ secrets.FUENTE_TALAGANTE }}
        run: |
          set -eu
          if [ -z "$FUENTE_TALAGANTE" ]; then
            echo "::error::Falta el secreto FUENTE_TALAGANTE."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/fuentes"
          printf '%s' "$FUENTE_TALAGANTE" | base64 --decode > "$RUNNER_TEMP/fuentes/Talagante.otf"

      - name: Retratar con kicad-retrata
        uses: piruetasxyz/kicad-retrata@v0
        with:
          carpeta-fuentes: ${{ runner.temp }}/fuentes

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Construir con Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v5
